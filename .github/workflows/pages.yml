name: Publish Bloomfall

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Version website files to refresh browser caches
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'dist/index.html';
          const html = fs.readFileSync(file, 'utf8').replace(
            /(src|href)="([^"?]+\.(?:js|css))(?:\?[^\"]*)?"/g,
            (_, attr, path) => `${attr}="${path}?v=${process.env.GITHUB_SHA}"`
          );
          fs.writeFileSync(file, html);
          NODE
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Wait for the uploaded website to be available
        uses: actions/github-script@v8
        with:
          script: |
            for (let attempt = 0; attempt < 12; attempt++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo,
                run_id: context.runId,
              });
              if (result.data.artifacts.some(a => a.name === 'github-pages' && !a.expired)) {
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('The uploaded website is not available yet.');
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
